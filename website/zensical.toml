[project]
site_name = "プロダクト設計資料"
site_url = "https://KUMA-roza.github.io/pages-handson/"
docs_dir = "_build"        # build.sh が docs/ と content/ を合体させる一時フォルダ
site_dir = "site"
edit_uri = "edit/main/docs/"
repo_url = "https://github.com/KUMA-roza/pages-handson"

nav = [
  { "ホーム" = "index.md" },              # website/content/index.md
  { "Inception" = [
    "inception/index.md",
    { "要件定義" = "inception/requirements.md" },
    { "ユーザーストーリー" = "inception/user-stories.md" },
  ] },
  { "Construction" = [
    "construction/index.md",
    { "ドメインモデル" = "construction/domain-model.md" },
    { "アーキテクチャ" = "construction/architecture.md" },
  ] },
]

[project.theme]
language = "ja"
features = [
  "navigation.tabs",        # フェーズを上部タブに
  "navigation.indexes",     # 各フォルダの index.md をセクションの顔に
  "navigation.path",        # パンくず
  "navigation.instant",     # SPA 的な高速遷移（site_url 必須）
  "toc.follow",
  "navigation.top",
  "content.action.edit",   # このページを編集
  "content.action.view",   # ソースを表示
]

[project.markdown_extensions]
pymdownx.superfences.custom_fences = [
  { name = "mermaid", class = "mermaid", format = "pymdownx.superfences.fence_code_format" },
]